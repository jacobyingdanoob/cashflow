name: Build and verify Mac release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to receive the verified Mac app
        required: true
        default: v1.2.0

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version and draft
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
      - run: npm ci
      - run: npm test
      - name: Build universal Mac app
        run: npm run desktop:build:mac
      - name: Launch and verify the packaged Mac app
        run: npm run desktop:smoke:mac
      - name: Upload Mac download and checksum to draft release
        run: |
          shasum -a 256 "release/Cashflow-${RELEASE_TAG#v}-macos-universal.zip" | sed 's|  release/|  |' > release/SHA256SUMS-macos.txt
          gh release upload "$RELEASE_TAG" "release/Cashflow-${RELEASE_TAG#v}-macos-universal.zip" release/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-verification
          path: test-results/desktop/
          retention-days: 7
